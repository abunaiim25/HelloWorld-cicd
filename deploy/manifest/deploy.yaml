apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  namespace: hello-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      imagePullSecrets:
        - name: registry-harbor-naiim.com
      containers:
        - name: my-app
          image: registry-harbor-naiim.com/test-project/hello-dev:43-jenkins-hello-dev
          ports:
            - containerPort: 80